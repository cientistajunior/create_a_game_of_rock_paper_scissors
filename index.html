<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Create a game of rock, paper, scissors</title>
        <link rel="stylesheet" href="styles.css"></link>
        <script src="script.js" defer></script>
    </head>
    <body>
        <nav></nav>
        <main>
            <section>
                <h1>A Game of Rock, Paper, Scissors</h1>
                <p class="game-subtitle">Can you play?</p>
            </section>
            <section class="button-container">
                <button class="rock">Rock</button>
                <button class="paper">Paper</button>
                <button class="scissors">Scissors</button>
            </section>
            <section class="results-container">
                <p class="round-explanation"></p>
                <p class="score-board">Placar: Humano 0 X 0 Computador</p>
                <h2 class="final-message"></h2>

                <button class="btn-reset" style="display: none;">Jogar Novamente</button>
            </section>
        </main>  
        <footer></footer>
    </body>
</html>
